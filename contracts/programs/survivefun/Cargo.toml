[package]
name = "survivefun"
version = "0.1.0"
description = "Survive.fun Anchor program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "survivefun"

[features]
no-entrypoint = []
no-idl-build = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
